services:
  api:
    build: .
    volumes: ["./backend:/app/backend"]
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [api]
